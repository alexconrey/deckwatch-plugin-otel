[package]
name = "deckwatch-plugin-otel"
version = "0.2.0"
edition = "2021"
description = "Deckwatch plugin — injects an OpenTelemetry Collector sidecar and OTEL_* env vars into deployments and applications"
repository = "https://github.com/alexconrey/deckwatch-plugin-otel"
license = "Apache-2.0"

[lib]
# cdylib produces plugin.wasm; rlib lets `cargo test` run on the host target.
crate-type = ["cdylib", "rlib"]

[dependencies]
# SDK main (v0.9.0 + McpTuningField), pinned by commit. deckwatch >= 0.6.4
# also accepts sidecar volumes, split resources and min_deckwatch_version,
# which are not in the SDK yet; src/host.rs emits those (see its docs).
deckwatch-plugin-sdk = { git = "https://github.com/alexconrey/deckwatch-plugin-sdk", tag = "v0.10.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
base64 = "0.23"

# extism-pdk only links on WASM: its host functions don't exist on native
# targets, and tests run on the host. Default features are off so the
# binary has no HTTP host-function support at all (the plugin never makes
# outbound requests; `allowed_hosts` stays empty).
[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = { version = "1", default-features = false }

[dev-dependencies]
# Parses the rendered collector config in tests.
yaml-rust2 = "0.13"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
